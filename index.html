<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#ffe4ec" />
<title>Foto Foto Favorit Caca versi Irham</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Bangers&family=Caveat:wght@500;600;700&family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Dancing+Script:wght@600;700&family=Pacifico&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --font-body:'Quicksand',system-ui,-apple-system,sans-serif;
    --font-cover:'Playfair Display',serif;
    --font-hand:'Caveat',cursive;
  }

  /* ============================================================
     PALET WARNA UNIK PER HALAMAN (sangat berbeda satu sama lain)
     ============================================================ */

  /* -------- 1. COVER: Rose Romance (PINK) -------- */
  body{
    --c-bg1:#ffe4ec;
    --c-bg2:#ffd4e3;
    --c-bg3:#ffb8d1;
    --c-accent:#e26a8d;  --c-accent-dark:#c14b6e;
    --c-text:#4a2b36;    --c-muted:#8a6b76;
    --c-ph-border:#f2bccd; --c-ph-bg:#fff7fa; --c-ph-color:#e6a3b7;
    --c-shadow:rgba(193,75,110,.16);
    --c-shadow-strong:rgba(193,75,110,.28);
    --c-nav-bg:rgba(255,255,255,.86);
    --c-nav-border:rgba(226,106,141,.22);
    --c-nav-shadow:rgba(193,75,110,.22);
    --c-topbar-bg:rgba(255,246,249,.8);
    --c-topbar-border:rgba(226,106,141,.16);
    --c-dot-idle:#f4c6d6;  --c-dot-hover:#eda2ba;
    --font-page:'Playfair Display',serif;
  }

  /* -------- 2. LUCU: Sunny Yellow (KUNING CERAH) -------- */
  body[data-theme="lucu"]{
    --c-bg1:#fff5cc;
    --c-bg2:#ffeaa0;
    --c-bg3:#ffde70;
    --c-accent:#f59e0b;  --c-accent-dark:#d97706;
    --c-text:#4a3518;    --c-muted:#8f7545;
    --c-ph-border:#ffe3a3; --c-ph-bg:#fffdf2; --c-ph-color:#e6c56b;
    --c-shadow:rgba(217,119,6,.2);
    --c-shadow-strong:rgba(217,119,6,.35);
    --c-nav-bg:rgba(255,253,242,.92);
    --c-nav-border:rgba(245,158,11,.3);
    --c-nav-shadow:rgba(217,119,6,.28);
    --c-topbar-bg:rgba(255,250,220,.88);
    --c-topbar-border:rgba(245,158,11,.25);
    --c-dot-idle:#ffe3a3;  --c-dot-hover:#ffc97a;
    --font-page:'Baloo 2',cursive;
  }

  /* -------- 3. CANTIK: Lavender (UNGU) -------- */
  body[data-theme="cantik"]{
    --c-bg1:#f0e8ff;
    --c-bg2:#e0cfff;
    --c-bg3:#cbb0ff;
    --c-accent:#a855f7;  --c-accent-dark:#7d4bc4;
    --c-text:#3d2a55;    --c-muted:#7a6496;
    --c-ph-border:#dcc7f5; --c-ph-bg:#faf5ff; --c-ph-color:#b89be0;
    --c-shadow:rgba(125,75,196,.18);
    --c-shadow-strong:rgba(125,75,196,.32);
    --c-nav-bg:rgba(252,248,255,.92);
    --c-nav-border:rgba(168,85,247,.3);
    --c-nav-shadow:rgba(125,75,196,.26);
    --c-topbar-bg:rgba(243,232,255,.88);
    --c-topbar-border:rgba(168,85,247,.22);
    --c-dot-idle:#dcc7f5;  --c-dot-hover:#b89be0;
    --font-page:'Cormorant Garamond',serif;
  }

  /* -------- 4. IMUT: Peach Mint (PEACH + MINT) -------- */
  body[data-theme="imut"]{
    --c-bg1:#ffe0d9;
    --c-bg2:#ffcbd5;
    --c-bg3:#c9f2da;
    --c-accent:#ff6b8a;  --c-accent-dark:#e04a6b;
    --c-text:#4a2f30;    --c-muted:#96706a;
    --c-ph-border:#ffccc5; --c-ph-bg:#fffaf8; --c-ph-color:#ffb5a5;
    --c-shadow:rgba(224,74,107,.18);
    --c-shadow-strong:rgba(224,74,107,.32);
    --c-nav-bg:rgba(255,251,248,.92);
    --c-nav-border:rgba(255,107,138,.3);
    --c-nav-shadow:rgba(224,74,107,.26);
    --c-topbar-bg:rgba(255,240,236,.88);
    --c-topbar-border:rgba(255,107,138,.22);
    --c-dot-idle:#ffccc5;  --c-dot-hover:#ffb5a5;
    --font-page:'Pacifico',cursive;
  }

  /* -------- 5. AIB: Teal (HIJAU TEAL) -------- */
  body[data-theme="aib"]{
    --c-bg1:#d0f7ef;
    --c-bg2:#a5e8dd;
    --c-bg3:#78d6c9;
    --c-accent:#14b8a6;  --c-accent-dark:#0f8a7d;
    --c-text:#154640;    --c-muted:#4d847d;
    --c-ph-border:#94dcd1; --c-ph-bg:#f6fffd; --c-ph-color:#6dc8bb;
    --c-shadow:rgba(15,138,125,.18);
    --c-shadow-strong:rgba(15,138,125,.35);
    --c-nav-bg:rgba(247,255,254,.92);
    --c-nav-border:rgba(20,184,166,.3);
    --c-nav-shadow:rgba(15,138,125,.28);
    --c-topbar-bg:rgba(232,250,247,.9);
    --c-topbar-border:rgba(20,184,166,.25);
    --c-dot-idle:#94dcd1;  --c-dot-hover:#6dc8bb;
    --font-page:'Bangers',cursive;
  }

  /* -------- 6. SEXY: Dark Wine (BURGUNDY GELAP) -------- */
  body[data-theme="sexy"]{
    --c-bg1:#2a0e18;
    --c-bg2:#3d1524;
    --c-bg3:#4f1d30;
    --c-accent:#e8b04d;  --c-accent-dark:#f5ca70;
    --c-text:#fbe8ee;    --c-muted:#c999ab;
    --c-ph-border:#7d4453; --c-ph-bg:#3a1523; --c-ph-color:#b88298;
    --c-shadow:rgba(0,0,0,.5);
    --c-shadow-strong:rgba(0,0,0,.75);
    --c-nav-bg:rgba(42,18,26,.92);
    --c-nav-border:rgba(232,176,77,.35);
    --c-nav-shadow:rgba(0,0,0,.55);
    --c-topbar-bg:rgba(42,14,24,.9);
    --c-topbar-border:rgba(232,176,77,.25);
    --c-dot-idle:#7d4453;  --c-dot-hover:#b88298;
    --font-page:'Cinzel',serif;
  }

  /* -------- 7. FAVORIT IRHAM: Sunset Orange (ORANYE HANGAT) -------- */
  body[data-theme="favorit-irham"]{
    --c-bg1:#fff0d9;
    --c-bg2:#ffd9a3;
    --c-bg3:#ffc47a;
    --c-accent:#ea8c1c;  --c-accent-dark:#b35e05;
    --c-text:#4a2e14;    --c-muted:#8a6a45;
    --c-ph-border:#ffd0a3; --c-ph-bg:#fffbf2; --c-ph-color:#f0c078;
    --c-shadow:rgba(179,94,5,.2);
    --c-shadow-strong:rgba(179,94,5,.35);
    --c-nav-bg:rgba(255,251,242,.92);
    --c-nav-border:rgba(234,140,28,.3);
    --c-nav-shadow:rgba(179,94,5,.28);
    --c-topbar-bg:rgba(255,246,232,.88);
    --c-topbar-border:rgba(234,140,28,.22);
    --c-dot-idle:#ffd0a3;  --c-dot-hover:#f0c078;
    --font-page:'Dancing Script',cursive;
  }

  /* -------- 8. SURAT: Classic Ivory (KREM) -------- */
  body[data-theme="surat"]{
    --c-bg1:#fffaf0;
    --c-bg2:#f8ead0;
    --c-bg3:#f0d9a8;
    --c-accent:#c9975c;  --c-accent-dark:#a87a3f;
    --c-text:#4a3a28;    --c-muted:#8a7a62;
    --c-ph-border:#ecd6b3; --c-ph-bg:#fffcf6; --c-ph-color:#d4b382;
    --c-shadow:rgba(168,122,63,.15);
    --c-shadow-strong:rgba(168,122,63,.28);
    --c-nav-bg:rgba(255,252,246,.9);
    --c-nav-border:rgba(201,151,92,.28);
    --c-nav-shadow:rgba(168,122,63,.22);
    --c-topbar-bg:rgba(255,250,240,.88);
    --c-topbar-border:rgba(201,151,92,.22);
    --c-dot-idle:#ecd6b3;  --c-dot-hover:#d4b382;
    --font-page:'Caveat',cursive;
  }

  /* ============================================================
     BASE
     ============================================================ */
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--font-body);
    color:var(--c-text);
    min-height:100vh;
    /* background-color utama yang AKAN BERUBAH sesuai tema */
    background-color:var(--c-bg1);
    /* lapisan gradien overlay di atasnya */
    background-image:
      radial-gradient(circle at 12% 8%, var(--c-bg2) 0%, transparent 45%),
      radial-gradient(circle at 88% 2%, var(--c-bg3) 0%, transparent 42%),
      radial-gradient(circle at 50% 105%, var(--c-bg1) 0%, transparent 55%),
      linear-gradient(160deg, transparent 0%, var(--c-bg2) 60%, var(--c-bg3) 100%);
    background-attachment:fixed;
    padding-bottom:120px;
    overflow-x:hidden;
    /* transisi warna yang smooth saat ganti halaman */
    transition:
      background-color .6s ease,
      color .4s ease;
  }

  /* ============================================================
     HATI MELAYANG GLOBAL
     ============================================================ */
  .hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .hearts span{
    position:absolute;bottom:-50px;font-size:18px;opacity:0;
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) rotate(0);opacity:0}
    10%{opacity:.4}
    90%{opacity:.25}
    100%{transform:translateY(-112vh) rotate(70deg);opacity:0}
  }

  /* ============================================================
     TOPBAR
     ============================================================ */
  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 20px;
    background:var(--c-topbar-bg);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--c-topbar-border);
    transition:background .5s ease, border-color .5s ease;
  }
  .brand{
    font-family:var(--font-cover);
    font-weight:700;font-size:1.05rem;letter-spacing:.4px;
    color:var(--c-accent-dark);
    transition:color .5s ease;
  }
  .brand span{color:var(--c-accent);display:inline-block;animation:beat 2s ease-in-out infinite}
  .counter{font-size:.82rem;font-weight:700;color:var(--c-muted);letter-spacing:.5px}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

  /* ============================================================
     MAIN
     ============================================================ */
  main{
    position:relative;z-index:1;
    max-width:1080px;margin:0 auto;padding:30px 20px 40px;
    transition:opacity .2s ease, transform .2s ease;
  }
  main.swapping{opacity:0;transform:translateY(8px)}

  /* ============================================================
     COVER
     ============================================================ */
  .cover-page{
    min-height:calc(100vh - 190px);
    display:flex;align-items:center;justify-content:center;
    padding:20px 0 40px;position:relative;
  }
  .cover-frame{
    position:relative;max-width:600px;width:100%;
    padding:75px 42px 60px;
    background:rgba(255,255,255,.42);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-radius:32px;
    border:1px solid var(--c-nav-border);
    box-shadow:
      0 30px 80px var(--c-shadow-strong),
      0 0 60px rgba(255,255,255,.35),
      inset 0 0 80px rgba(255,255,255,.5);
    text-align:center;overflow:hidden;
  }
  .cover-frame::before{
    content:'';position:absolute;inset:16px;
    border:1px solid var(--c-accent);border-radius:22px;
    opacity:.35;pointer-events:none;
  }
  .cover-frame::after{
    content:'';position:absolute;inset:24px;
    border:1px dashed var(--c-accent);border-radius:16px;
    opacity:.28;pointer-events:none;
  }
  .cover-ring{
    position:absolute;top:38%;left:50%;
    width:220px;height:220px;border-radius:50%;
    border:1px dashed var(--c-accent);opacity:.32;
    transform:translate(-50%,-50%);pointer-events:none;
    animation:spin 40s linear infinite;
  }
  .cover-ring.inner{
    width:160px;height:160px;border-style:dotted;opacity:.22;
    animation-duration:25s;animation-direction:reverse;
  }
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .cover-glow{
    position:absolute;top:38%;left:50%;
    width:280px;height:280px;border-radius:50%;
    background:radial-gradient(circle, var(--c-accent) 0%, transparent 68%);
    opacity:.22;transform:translate(-50%,-50%);
    pointer-events:none;filter:blur(18px);
    animation:glowPulse 4s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{opacity:.18;transform:translate(-50%,-50%) scale(1)}
    50%{opacity:.32;transform:translate(-50%,-50%) scale(1.08)}
  }
  .cover-heart{
    position:relative;z-index:2;
    font-size:3.8rem;margin-bottom:26px;
    animation:heartPulse 2s ease-in-out infinite;
    filter:drop-shadow(0 8px 22px rgba(226,106,141,.55));
  }
  @keyframes heartPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.14)}
  }
  .cover-title{
    position:relative;z-index:2;
    font-family:var(--font-cover);font-weight:700;
    font-size:clamp(1.9rem,5.5vw,3.2rem);
    line-height:1.12;letter-spacing:.5px;
    background:linear-gradient(90deg,
      var(--c-accent-dark) 0%, var(--c-accent) 30%,
      var(--c-accent-dark) 55%, var(--c-accent) 80%,
      var(--c-accent-dark) 100%);
    background-size:220% auto;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:shimmer 4.5s linear infinite;
    filter:drop-shadow(0 2px 18px rgba(255,255,255,.6));
  }
  @keyframes shimmer{0%{background-position:0% center}100%{background-position:220% center}}
  .cover-title .sub-line{
    display:block;font-family:var(--font-cover);
    font-style:italic;font-weight:600;
    font-size:.48em;margin-top:18px;letter-spacing:3px;
    -webkit-text-fill-color:var(--c-accent);
    color:var(--c-accent);filter:none;
  }
  .cover-ornament{
    position:relative;z-index:2;
    display:flex;align-items:center;justify-content:center;
    gap:14px;margin:28px 0 22px;
  }
  .orn-line{
    width:80px;height:1px;
    background:linear-gradient(90deg,transparent,var(--c-accent),transparent);
  }
  .orn-heart{color:var(--c-accent);font-size:1.2rem;animation:beat 2s ease-in-out infinite}
  .cover-sub{
    position:relative;z-index:2;
    font-family:var(--font-hand);font-size:1.4rem;
    line-height:1.5;color:var(--c-muted);margin-bottom:36px;
  }
  .cover-cta{
    position:relative;z-index:2;
    display:inline-flex;align-items:center;gap:10px;
    padding:15px 38px;border:none;border-radius:99px;
    background:linear-gradient(135deg,var(--c-accent),var(--c-accent-dark));
    color:#fff;font-family:inherit;
    font-size:.88rem;font-weight:700;
    letter-spacing:2.5px;text-transform:uppercase;cursor:pointer;
    box-shadow:0 14px 34px var(--c-shadow-strong);
    overflow:hidden;
  }
  .cover-cta::after{
    content:'';position:absolute;top:0;left:-100%;
    width:100%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
    animation:shine 3s ease-in-out infinite;
  }
  @keyframes shine{0%,100%{left:-100%}50%,60%{left:100%}}
  .cover-cta:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 20px 44px var(--c-shadow-strong)}
  .cover-sparkle{
    position:absolute;font-size:1.1rem;
    color:var(--c-accent);opacity:0;pointer-events:none;
    animation:twinkle 3.5s ease-in-out infinite;z-index:1;
  }
  @keyframes twinkle{
    0%,100%{opacity:0;transform:scale(.3) rotate(0deg)}
    50%{opacity:1;transform:scale(1.2) rotate(180deg)}
  }
  .corner{
    position:absolute;font-size:1.4rem;color:var(--c-accent);
    opacity:.7;animation:beat 2.6s ease-in-out infinite;z-index:2;
  }
  .corner.tl{top:14px;left:22px}
  .corner.tr{top:14px;right:22px;animation-delay:.4s}
  .corner.bl{bottom:14px;left:22px;animation-delay:.8s}
  .corner.br{bottom:14px;right:22px;animation-delay:1.2s}

  /* ============================================================
     PAGE HEAD
     ============================================================ */
  .page-head{text-align:center;margin-bottom:26px;position:relative;z-index:2}
  .page-emoji{display:block;font-size:2.3rem;margin-bottom:10px;animation:beat 2.4s ease-in-out infinite}
  .page-title{
    font-family:var(--font-page);
    font-weight:700;
    font-size:clamp(1.7rem,4.6vw,2.9rem);
    line-height:1.18;
    color:var(--c-accent-dark);
    letter-spacing:.3px;
    transition:color .5s ease;
  }
  .page-note{
    margin-top:12px;font-size:.95rem;color:var(--c-muted);
    font-weight:500;max-width:480px;margin-left:auto;margin-right:auto;
  }
  .divider{
    width:90px;height:3px;margin:18px auto 0;border-radius:99px;
    background:linear-gradient(90deg,transparent,var(--c-accent),transparent);
  }

  /* Judul per tema */
  body[data-theme="lucu"] .page-title{
    font-weight:800;font-size:clamp(1.9rem,5.2vw,3.3rem);
    letter-spacing:.5px;
    animation:bounceTitle 2.8s ease-in-out infinite;
  }
  @keyframes bounceTitle{
    0%,100%{transform:translateY(0) rotate(-1deg)}
    50%{transform:translateY(-6px) rotate(1deg)}
  }
  body[data-theme="cantik"] .page-title{
    font-weight:500;font-style:italic;
    letter-spacing:3px;
    font-size:clamp(1.8rem,5vw,3.1rem);
  }
  body[data-theme="imut"] .page-title{
    font-weight:400;
    font-size:clamp(1.5rem,4.5vw,2.7rem);
    animation:wiggleTitle 4s ease-in-out infinite;
  }
  @keyframes wiggleTitle{
    0%,100%{transform:rotate(-1.5deg)}
    50%{transform:rotate(1.5deg)}
  }
  body[data-theme="aib"] .page-title{
    font-weight:400;text-transform:uppercase;
    letter-spacing:3px;
    font-size:clamp(2rem,5.5vw,3.4rem);
    text-shadow:3px 3px 0 rgba(255,255,255,.6), 5px 5px 0 var(--c-accent);
    transform:rotate(-2deg);
    display:inline-block;
  }
  body[data-theme="sexy"] .page-title{
    font-weight:700;text-transform:uppercase;
    letter-spacing:6px;
    font-size:clamp(1.5rem,4.3vw,2.7rem);
    background:linear-gradient(90deg,#f5ca70 0%, #fff2c4 50%, #e8b04d 100%);
    background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:shimmer 4s linear infinite;
    filter:drop-shadow(0 0 20px rgba(232,176,77,.4));
  }
  body[data-theme="favorit-irham"] .page-title{
    font-weight:700;
    font-size:clamp(2.1rem,5.5vw,3.6rem);
    letter-spacing:.5px;
  }

  /* ============================================================
     DEKORASI
     ============================================================ */
  .page{position:relative}
  .decor-layer{
    position:absolute;inset:-20px;pointer-events:none;
    overflow:hidden;z-index:0;border-radius:20px;
  }
  .deco{position:absolute;pointer-events:none}

  /* Pola latar per tema */
  body[data-theme="lucu"] .decor-layer{
    background-image:radial-gradient(circle, rgba(245,158,11,.15) 3px, transparent 3px);
    background-size:34px 34px;
  }
  body[data-theme="cantik"] .decor-layer{
    background-image:
      radial-gradient(circle at 20% 30%, rgba(168,85,247,.1) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(168,85,247,.08) 0%, transparent 40%);
  }
  body[data-theme="imut"] .decor-layer{
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,107,138,.12) 0%, transparent 30%),
      radial-gradient(circle at 85% 80%, rgba(122,208,168,.12) 0%, transparent 30%);
  }
  body[data-theme="aib"] .decor-layer{
    background-image:radial-gradient(circle, rgba(15,138,125,.15) 2px, transparent 2px);
    background-size:18px 18px;
  }
  body[data-theme="sexy"] .decor-layer{
    background:radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,.45) 90%);
  }
  body[data-theme="favorit-irham"] .decor-layer{
    background:
      radial-gradient(circle at 30% 20%, rgba(255,228,180,.4) 0%, transparent 40%),
      radial-gradient(circle at 70% 80%, rgba(255,200,150,.35) 0%, transparent 45%);
  }

  /* ============================================================
     SINGLE PHOTO FRAME
     ============================================================ */
  .single-photo-wrap{
    display:flex;justify-content:center;align-items:center;
    position:relative;padding:30px 10px;z-index:2;
  }
  .single-photo{
    position:relative;width:100%;max-width:400px;
    aspect-ratio:3/4;background:#fff;
    padding:14px 14px 58px;
    border-radius:6px;

  dotsEl.appendChild(b);

/* ---------- DEKORASI UNIK PER TEMA ---------- */

      <span class="deco warm-dust" style="left:82%;bottom:0;--s:8px;--d:1.4s"></span>
      <span class="deco warm-dust" style="left:30%;bottom:0;--s:5px;--d:3s"></span>
      <span class="deco warm-dust" style="right:18%;bottom:0;--s:7px;--d:4.6s"></span>
      <span class="deco warm-dust" style="right:36%;bottom:0;--s:5px;--d:6s"></span>
      <span class="deco warm-heart" style="left:8%;top:22%;--d:0s">💛</span>

}

/* ---------- COVER ---------- */
function coverHTML(){
  return `
    <section class="page cover-page">
      <div class="cover-frame">
        <div class="cover-glow"></div>
        <div class="cover-ring"></div>
        <div class="cover-ring inner"></div>

        <span class="corner tr">♥</span>
        <span class="corner bl">♥</span>
        <span class="corner br">♥</span>

        <span class="cover-sparkle" style="top:10%;left:8%;animation-delay:0s">✦</span>
        <span class="cover-sparkle" style="top:18%;right:9%;animation-delay:.8s">✧</span>
        <span class="cover-sparkle" style="top:52%;left:5%;animation-delay:1.6s">✦</span>

          Foto Foto<br>Favorit Caca

        <div class="cover-ornament">
          <span class="orn-line"></span>
          <span class="orn-heart">♥</span>
          <span class="orn-line"></span>
        </div>

        <p class="cover-sub">
          Sebuah album kecil<br>
          tentang kamu, untuk kamu

        <button class="cover-cta" type="button">
          Buka Album ✨

}

/* ---------- ALBUM ---------- */
function albumHTML(a){
  const file = a.photo && a.photo.trim();
  const pearls = a.theme === 'cantik' ? `
    <span class="cantik-pearl" style="top:-22px;left:-22px"></span>
    <span class="cantik-pearl" style="top:-22px;right:-22px"></span>
    <span class="cantik-pearl" style="bottom:-22px;left:-22px"></span>
    <span class="cantik-pearl" style="bottom:-22px;right:-22px"></span>
  ` : '';

  return `
    <section class="page">
      <div class="decor-layer" aria-hidden="true">${getDecor(a.theme)}</div>
      <div class="page-head">
        <span class="page-emoji">${a.emoji}</span>
        <h1 class="page-title">${a.title}</h1>
        <p class="page-note">${a.note}</p>
        <div class="divider"></div>
      </div>
      <div class="single-photo-wrap">
        <figure class="single-photo">
          ${pearls}
          <div class="ph">♥<small>Foto menyusul</small></div>
          ${file
            ? `<img src="images/${a.folder}/${file}" alt="${a.title}" onerror="this.remove()">`
            : ''}
          <figcaption><span class="cap-heart">♥</span></figcaption>
        </figure>
      </div>
    </section>
  `;
}

/* ---------- SURAT ---------- */
function letterHTML(){
  return `
    <section class="page">
      <div class="decor-layer" aria-hidden="true">
        <span class="deco letter-flourish top">❦</span>
        <span class="deco letter-flourish bottom">❦</span>
      </div>
      <div class="page-head">
        <span class="page-emoji">💌</span>
        <h1 class="page-title">Surat untuk Caca</h1>
        <div class="divider"></div>
      </div>
      <div class="letter-wrap">
        <article class="letter">
          <p class="salutation">Sayangku,</p>
          <p>sudah banyak sekali foto momen yang sudah aku dokumentasikan. Banyak sekali cerita dibaliknya, itu mengingatkan aku bahwa hubungan kita sudah sangat meninggalkan bekas yang indah dalam hidup aku. Aku harap foto ini akan terus bertambah selamanya.</p>
          <p class="closing">I Love You <span class="heart">❤️</span></p>
          <p class="signature">— Irham</p>
          <span class="deco wax-seal">❤</span>
        </article>
      </div>
    </section>
  `;
}

/* ---------- RENDER — INI DIPERBAIKI ---------- */
function render(i){
  current = Math.max(0, Math.min(pages.length - 1, i));
  if (swapTimer) clearTimeout(swapTimer);

  app.classList.add('swapping');

  swapTimer = setTimeout(() => {
    swapTimer = null;
    const p = pages[current];

    /* ✅ BUG FIX: ambil theme dari p.theme ATAU p.data.theme */
    const theme = p.theme || (p.data && p.data.theme) || 'cover';
    document.body.dataset.theme = theme;

    if (p.type === 'cover')       app.innerHTML = coverHTML();
    else if (p.type === 'album')  app.innerHTML = albumHTML(p.data);
    else                          app.innerHTML = letterHTML();

    document.getElementById('curPage').textContent = current + 1;
    [...dotsEl.children].forEach((d, idx) =>
      d.classList.toggle('active', idx === current)
    );
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === pages.length - 1;

    app.classList.remove('swapping');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, 180);
}

app.addEventListener('click', e => {
  if (e.target.closest('.cover-cta')) render(current + 1);
});

prevBtn.addEventListener('click', () => render(current - 1));
nextBtn.addEventListener('click', () => render(current + 1));

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  render(current - 1);
  if (e.key === 'ArrowRight') render(current + 1);
});

let sx = 0, sy = 0;
document.addEventListener('touchstart', e => {
  sx = e.changedTouches[0].clientX;
  sy = e.changedTouches[0].clientY;
}, { passive:true });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy)) {
    if (dx < 0) render(current + 1);
    else        render(current - 1);
  }
}, { passive:true });

(function createHearts(){
  const box = document.getElementById('hearts');
  const chars = ['♥','💕','💗','❤️','🌸','💞'];
  for (let i = 0; i < 16; i++){
    const s = document.createElement('span');
    s.textContent = chars[Math.floor(Math.random() * chars.length)];
    s.style.left = Math.random() * 100 + '%';
    s.style.fontSize = (12 + Math.random() * 16) + 'px';
    s.style.animationDuration = (14 + Math.random() * 14) + 's';
    s.style.animationDelay = (-Math.random() * 24) + 's';
    box.appendChild(s);
  }
})();

render(0);
</script>
